<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · 켜는 곳은 자식이 아니라 부모입니다</title>
 
<style>
    /*
    9주차 예제 1 — 켜는 곳은 자식이 아니라 부모입니다
    */

    body {
      /* 웹페이지 전체 배경색을 노란색으로 설정합니다. */
      background-color: yellow;
    }

    .container {
      /* 부모 요소를 Flex 컨테이너로 설정합니다. */
      display: flex;
    }

    /*
    .container의 자식 요소들(Flex Item)이
    자동으로 가로 방향으로 나란히 배치됩니다.
    */
</style>

</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>학번 202378121</li>
    <li>이름 김은재</li>
    <li>전공학과 소프트웨아</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
